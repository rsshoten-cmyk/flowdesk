<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>FlowDesk | 共有カレンダー</title><style>
:root{--navy:#10243a;--blue:#2864dc;--pale:#edf4ff;--line:#dce4ee;--bg:#f6f8fb;--text:#17283b;--muted:#63758a;--red:#d94d5b;--green:#1f9b70}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:var(--navy);color:#d7e4f8;padding:25px 14px}.brand{color:#fff;font-size:21px;font-weight:800;padding:0 10px 27px}.brand b{color:#8ab0ff}.side button{width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:11px 10px;border-radius:8px;margin:2px 0}.side button.active,.side button:hover{background:#274568;color:#fff}.side small{display:block;color:#91a7c1;padding:23px 10px 6px;letter-spacing:1px}.user{position:fixed;bottom:18px;font-size:13px;padding:12px}.avatar{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#7192c7;color:#fff;margin-right:7px}main{padding:28px;max-width:1450px;width:100%;margin:auto}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}h1{font-size:25px;margin:0}.sub{color:var(--muted);font-size:14px;margin-top:5px}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:white;font-weight:700}.btn.alt{background:white;color:var(--text);border:1px solid var(--line)}.filters{background:white;border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.filters select{border:1px solid var(--line);padding:9px;border-radius:7px;background:white}.viewbar{display:flex;justify-content:space-between;align-items:center;margin:15px 0}.tabs button{border:1px solid var(--line);background:#fff;padding:8px 12px}.tabs button.active{background:var(--pale);color:var(--blue);font-weight:bold}.calendar{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.calhead{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.calhead h2{font-size:18px;margin:0}.grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekday{padding:9px;text-align:center;background:#f8fafc;font-size:12px;color:var(--muted)}.day{min-height:125px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px}.day:nth-child(7n){border-right:0}.day.dim{background:#fafbfc;color:#a4afbe}.date{font-weight:bold;font-size:13px}.event{display:block;width:100%;border:0;border-left:3px solid var(--blue);border-radius:3px;background:#e9f1ff;color:#234c9a;font-size:11px;padding:4px;margin-top:5px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.event.red{border-color:var(--red);background:#fff0f1;color:#aa3342}.event.green{border-color:var(--green);background:#e9f8f2;color:#18734f}.list{display:grid;gap:10px}.agenda{background:white;border:1px solid var(--line);padding:13px;border-radius:10px;display:flex;gap:13px;align-items:center}.time{color:var(--blue);font-weight:bold;min-width:88px}.badge{font-size:12px;padding:3px 7px;border-radius:999px;background:var(--pale);color:var(--blue)}dialog{border:0;border-radius:14px;width:min(520px,calc(100% - 28px));padding:23px;box-shadow:0 15px 45px #13223855}dialog::backdrop{background:#10243a77}dialog h2{margin-top:0}.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:bold;display:grid;gap:5px}.form input,.form select,.form textarea{border:1px solid var(--line);padding:10px;border-radius:7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.notice{border-left:4px solid var(--green);background:#ebf9f3;padding:12px 14px;border-radius:6px;font-size:14px;margin:0 0 15px}.member{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:11px 0}.mobileNav{display:none}@media(max-width:760px){.app{display:block}.side{display:none}main{padding:16px}header{align-items:flex-start}h1{font-size:21px}.filters{gap:6px}.filters select{max-width:48%;font-size:13px}.day{min-height:82px;padding:4px}.event{font-size:9px;padding:3px}.weekday{font-size:10px;padding:7px 2px}.calhead{padding:11px}.calhead h2{font-size:16px}.mobileNav{position:fixed;z-index:4;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px}.mobileNav button{border:0;background:transparent;color:var(--muted);font-size:12px}.mobileNav button.active{color:var(--blue);font-weight:bold}main{padding-bottom:72px}.user{display:none}.agenda{align-items:flex-start}.row{grid-template-columns:1fr}}
</style><style>.event.blue{border-left-color:#1769e0!important;background:#dceaff!important;color:#083a83!important}.event.purple{border-left-color:#7c3aed!important;background:#eee7ff!important;color:#51209e!important}.event.orange{border-left-color:#ea8500!important;background:#fff0ce!important;color:#8c4500!important}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:8px;vertical-align:-1px}</style></head><body><div class="app"><aside class="side"><div class="brand">Flow<b>Desk</b></div><button class="active">▣ 共有カレンダー</button><button>✓ タスク</button><button>◫ プロジェクト</button><small>共有</small><button onclick="members.showModal()">♙ メンバー</button><button onclick="notify()">◉ 通知設定</button><div class="user"><span class="avatar">田</span>田中 恒一<br><span style="margin-left:36px;color:#91a7c1">営業部</span></div></aside><main><header><div><h1>共有カレンダー</h1><div class="sub">営業部 · 新商品ローンチ · 全社員の予定と期限</div></div><button class="btn" onclick="eventDialog.showModal()">＋ 予定を追加</button></header><div class="notice">招待リンクを送るだけで、メンバーと予定を共有できます。</div><div class="filters"><button class="btn alt" onclick="members.showModal()">メンバー</button></div><div class="viewbar"><div class="tabs"><button onclick="setView('day')">日</button><button onclick="setView('week')">週</button><button class="active" onclick="setView('month')">月</button></div><div><button class="btn alt" onclick="move(-1)">‹</button> <b id="label">2026年9月</b> <button class="btn alt" onclick="move(1)">›</button></div></div><section id="surface"></section></main></div><nav class="mobileNav"><button class="active">カレンダー</button><button onclick="eventDialog.showModal()">予定を追加</button><button onclick="members.showModal()">メンバー</button></nav><dialog id="eventDialog"><form method="dialog" onsubmit="addEvent(event)"><h2>共有予定を追加</h2><div class="form"><label>予定名<input id="title" required placeholder="例：新商品ローンチ会議"></label><div class="row"><label>開始<input id="start" type="datetime-local" required></label><label>終了<input id="end" type="datetime-local" required></label></div><div class="row"><label>担当者<select id="who"><option>田中 恒一</option><option>佐藤 美咲</option><option>鈴木 健</option></select></label><label>共有範囲<select id="scope"><option>営業部</option><option>新商品ローンチ</option><option>全社員</option></select></label></div><label>場所<input id="place" placeholder="例：会議室A / Zoom"></label><label>メモ<textarea id="memo" rows="3" placeholder="目的・持ち物など"></textarea></label></div><div class="actions"><button class="btn alt" type="button" onclick="eventDialog.close()">キャンセル</button><button class="btn">追加</button></div></form></dialog><dialog id="members"><h2>メンバー</h2><p class="sub">このカレンダーを共有しているメンバーです。</p><button class="btn" onclick="copyInvite()">招待リンクをコピー</button><div class="member"><span>田中 恒一<br><small>　招待済み</small></span></div><div class="member"><span>佐藤 美咲<br><small>　招待済み</small></span></div><div class="member"><span>鈴木 健<br><small>　招待済み</small></span></div><div class="actions"><button class="btn alt" onclick="members.close()">閉じる</button></div></dialog><script>
const memberColor={'田中 恒一':'blue','佐藤 美咲':'purple','鈴木 健':'orange'};let month=8,view='month';let events=JSON.parse(localStorage.getItem('flowdesk-shared-events')||'null')||[{title:'新商品ローンチ会議',date:'2026-09-22',time:'10:00',who:'田中 恒一',scope:'新商品ローンチ',type:'blue'},{title:'提案資料の提出期限（タスク）',date:'2026-09-24',time:'17:00',who:'佐藤 美咲',scope:'営業部',type:'red'},{title:'営業週次ミーティング',date:'2026-09-25',time:'09:30',who:'鈴木 健',scope:'営業部',type:'green'}];function draw(){if(view==='month'){let first=new Date(2026,month,1),s=new Date(2026,month,1-first.getDay());surface.innerHTML='<div class="calendar"><div class="grid">'+['日','月','火','水','木','金','土'].map(x=>'<div class="weekday">'+x+'</div>').join('')+Array.from({length:42},(_,i)=>{let d=new Date(s);d.setDate(s.getDate()+i);let key=`2026-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return `<div class="day ${d.getMonth()!=month?'dim':''}"><span class="date">${d.getDate()}</span>${events.filter(e=>e.date===key).map(e=>`<button class="event ${memberColor[e.who]||e.type}">${e.time} ${e.title}</button>`).join('')}</div>`}).join('')+'</div></div>'}else{let list=events.sort((a,b)=>a.date.localeCompare(b.date));surface.innerHTML='<div class="list">'+list.map(e=>`<div class="agenda"><div class="time">${e.date.slice(5).replace('-','/')}<br>${e.time}</div><div><b>${e.title}</b><div class="sub">担当：${e.who}　場所：${e.place||'未設定'}</div><span class="badge">${e.scope}</span></div></div>`).join('')+'</div>'}label.textContent=`2026年${month+1}月`}function move(n){month=(month+n+12)%12;draw()}function setView(v){view=v;document.querySelectorAll('.tabs button').forEach((x,i)=>x.classList.toggle('active',['day','week','month'][i]===v));draw()}function addEvent(e){e.preventDefault();let d=new Date(start.value);events.push({title:title.value,date:d.toISOString().slice(0,10),time:d.toTimeString().slice(0,5),who:who.value,scope:scope.value,place:place.value,type:memberColor[who.value]||'blue'});localStorage.setItem('flowdesk-shared-events',JSON.stringify(events));eventDialog.close();e.target.reset();draw()}function copyInvite(){navigator.clipboard?.writeText(location.href);alert('招待リンクをコピーしました')}function notify(){alert('通知設定\n予定変更と開始15分前の通知が有効です。')}if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').then(r=>r.update());draw();
</script></body></html>
