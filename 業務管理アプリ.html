<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132238">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>FlowDesk | 業務管理</title>
  <style>
    :root { --navy:#132238; --blue:#356df1; --blue-soft:#eaf0ff; --bg:#f5f7fb; --line:#e5eaf2; --text:#1c2940; --muted:#718096; --red:#e25656; --amber:#d99a20; --green:#2e9a70; }
    * { box-sizing:border-box; } body { margin:0; font-family: Inter, "Noto Sans JP", "Yu Gothic", sans-serif; color:var(--text); background:var(--bg); }
    .app { display:grid; grid-template-columns:250px 1fr; min-height:100vh; }
    aside { background:var(--navy); color:#d8e3f5; padding:25px 16px; display:flex; flex-direction:column; }
    .brand { font-size:21px; font-weight:800; letter-spacing:.2px; padding:0 10px 32px; color:white; } .brand b { color:#7da5ff; }
    .nav-label { font-size:11px; color:#91a1ba; letter-spacing:1.2px; font-weight:bold; padding:0 10px 8px; }
    nav button { width:100%; border:0; color:inherit; background:transparent; font:inherit; text-align:left; padding:11px 10px; border-radius:8px; margin:2px 0; cursor:pointer; } nav button:hover, nav button.active { background:#263a58; color:white; } nav .ico { width:24px; display:inline-block; }
    .user { margin-top:auto; border-top:1px solid #31445e; padding:18px 10px 0; font-size:13px; } .avatar { display:inline-flex; width:31px;height:31px;border-radius:50%;background:#6e88c7;color:white;align-items:center;justify-content:center;font-weight:bold;margin-right:9px;vertical-align:middle; }
    main { padding:30px 38px; max-width:1500px; width:100%; margin:0 auto; } header { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; } h1 { font-size:25px; margin:0 0 5px; } .subtitle { color:var(--muted); font-size:14px; } .primary { border:0; background:var(--blue); color:white; border-radius:8px; padding:11px 16px; font-size:14px; font-weight:bold; cursor:pointer; box-shadow:0 4px 10px #356df144; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px; } .stat { background:white; padding:18px; border:1px solid var(--line); border-radius:12px; } .stat small { color:var(--muted); } .stat .number { font-size:27px; font-weight:800; margin-top:7px; } .number.red { color:var(--red); } .number.green { color:var(--green); }
    .toolbar { display:flex; gap:10px; margin:10px 0 17px; align-items:center; } input, select { border:1px solid #d8dfeb; background:white; border-radius:7px; padding:10px; color:var(--text); font:inherit; } #search { width:290px; } .spacer { flex:1; }
    .board { display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; align-items:start; } .column { background:#edf1f7; border-radius:11px; padding:12px; min-height:380px; } .column-head { display:flex; justify-content:space-between; align-items:center; padding:3px 4px 13px; font-weight:bold; font-size:14px; } .count { color:var(--muted); background:#dce4f0; border-radius:20px; padding:2px 8px; font-size:12px; }
    .card { background:white; border:1px solid var(--line); border-radius:9px; padding:14px; margin-bottom:10px; box-shadow:0 2px 4px #13223808; cursor:pointer; } .card:hover { border-color:#9bb7ff; } .card h3 { font-size:14px; margin:8px 0 13px; line-height:1.5; } .tag { display:inline-block; font-size:11px; border-radius:20px; padding:3px 8px; background:var(--blue-soft); color:#315fcf; } .priority-high { background:#ffeaea;color:#bf4444; } .priority-mid { background:#fff4dc;color:#ad7610; } .meta { display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:12px; } .person { width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#dce5f7;color:#3e5a90;font-size:10px;font-weight:bold; }
    dialog { width:min(480px,calc(100% - 32px)); border:0; border-radius:14px; padding:25px; box-shadow:0 20px 55px #11182755; } dialog::backdrop { background:#13223866; } dialog h2 { margin-top:0; font-size:20px; } .form-grid { display:grid; gap:13px; } label { display:grid; gap:6px; font-size:13px; font-weight:bold; } .actions { display:flex; justify-content:flex-end; gap:9px; margin-top:20px; } .secondary { background:white;border:1px solid #d8dfeb;border-radius:7px;padding:10px 14px;cursor:pointer; }
    .empty { color:#8491a5; font-size:13px; padding:15px 4px; } @media(max-width:900px) { .app{grid-template-columns:1fr} aside{display:none} main{padding:22px 16px}.stats{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:1fr 1fr} } @media(max-width:580px){.board{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}#search{width:100%}}
    .calendar-view { background:white; border:1px solid var(--line); border-radius:12px; overflow:hidden; } .calendar-controls{display:flex;align-items:center;justify-content:space-between;padding:17px;border-bottom:1px solid var(--line)} .calendar-controls h2{margin:0;font-size:18px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekday{padding:10px;text-align:center;background:#f7f9fc;color:var(--muted);font-size:12px;font-weight:bold}.day{min-height:125px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px}.day:nth-child(7n){border-right:0}.day.muted{background:#fafbfc;color:#aeb8c8}.day.today .date{background:var(--blue);color:white}.date{display:inline-flex;width:25px;height:25px;align-items:center;justify-content:center;border-radius:50%;font-weight:bold}.calendar-task{display:block;width:100%;border:0;border-left:3px solid var(--blue);background:#edf3ff;color:#284f9e;border-radius:3px;margin-top:5px;padding:4px 5px;text-align:left;font:11px inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.calendar-task.high{border-left-color:var(--red);background:#fff0f0;color:#ad3e3e}.calendar-task.done{opacity:.55;text-decoration:line-through}@media(max-width:580px){.day{min-height:88px;padding:4px}.calendar-task{font-size:9px;padding:3px}.weekday{padding:8px 2px;font-size:10px}.calendar-controls{padding:12px}.calendar-controls h2{font-size:16px}}
  </style>
</head>
<body>
  <div class="app"><aside><div class="brand">Flow<b>Desk</b></div><div class="nav-label">WORKSPACE</div><nav><button class="active" id="dashboardNav" onclick="showDashboard()"><span class="ico">▦</span>ダッシュボード</button><button onclick="showDashboard()"><span class="ico">✓</span>すべてのタスク</button><button><span class="ico">◫</span>プロジェクト</button><button id="calendarNav" onclick="showCalendar()"><span class="ico">▣</span>カレンダー</button></nav><div class="nav-label" style="margin-top:25px">管理</div><nav><button><span class="ico">♙</span>メンバー</button><button><span class="ico">⚙</span>設定</button></nav><div class="user"><span class="avatar">田</span>田中 恒一<br><small style="margin-left:40px;color:#91a1ba">営業部</small></div></aside>
  <main><header><div><h1 id="pageTitle">ダッシュボード</h1><div class="subtitle" id="today"></div></div><div style="display:flex;gap:8px"><button class="secondary" id="installBtn" hidden>アプリを追加</button><button class="primary" onclick="openDialog()">＋ 新しいタスク</button></div></header><div id="dashboardView">
  <section class="stats"><div class="stat"><small>自分の未完了タスク</small><div class="number" id="openCount">0</div></div><div class="stat"><small>本日期限</small><div class="number red" id="todayCount">0</div></div><div class="stat"><small>進行中プロジェクト</small><div class="number">3</div></div><div class="stat"><small>今週の完了</small><div class="number green" id="doneCount">0</div></div></section>
  <div class="toolbar"><input id="search" placeholder="タスクを検索…" oninput="render()"><select id="assignee" onchange="render()"><option value="">担当者：すべて</option><option>田中</option><option>佐藤</option><option>鈴木</option></select><span class="spacer"></span><select id="project" onchange="render()"><option value="">すべてのプロジェクト</option><option>新商品ローンチ</option><option>営業改善</option><option>社内運用</option></select></div>
  <section class="board" id="board"></section></div><section id="calendarView" hidden><div class="calendar-view"><div class="calendar-controls"><button class="secondary" onclick="changeMonth(-1)">‹ 前月</button><h2 id="monthLabel"></h2><div style="display:flex;gap:7px"><button class="secondary" onclick="goToday()">今日</button><button class="secondary" onclick="changeMonth(1)">翌月 ›</button></div></div><div class="calendar-grid" id="calendarGrid"></div></div></section></main></div>
  <dialog id="taskDialog"><form method="dialog" onsubmit="addTask(event)"><h2>新しいタスク</h2><div class="form-grid"><label>タスク名<input id="title" required placeholder="例：提案資料の初稿を作成"></label><label>プロジェクト<select id="newProject"><option>新商品ローンチ</option><option>営業改善</option><option>社内運用</option></select></label><label>担当者<select id="newAssignee"><option>田中</option><option>佐藤</option><option>鈴木</option></select></label><label>期限<input id="due" type="date" required></label><label>優先度<select id="priority"><option value="mid">中</option><option value="high">高</option><option value="low">低</option></select></label><label>写真・書類の添付（スマホのカメラ対応）<input id="attachment" type="file" accept="image/*,.pdf" capture="environment"></label></div><div class="actions"><button class="secondary" type="button" onclick="taskDialog.close()">キャンセル</button><button class="primary" type="submit">追加する</button></div></form></dialog>
  <dialog id="loginDialog"><form method="dialog" onsubmit="signIn(event)"><h2>FlowDesk にログイン</h2><p class="subtitle">デモでは社員を選んで利用できます。</p><div class="form-grid"><label>社員<select id="loginMember"><option value="田中">田中 恒一（営業部）</option><option value="佐藤">佐藤 美咲（企画部）</option><option value="鈴木">鈴木 健（営業部）</option></select></label></div><div class="actions"><button class="primary" type="submit">ログイン</button></div></form></dialog>
  <script>
    const initial=[
      {id:1,title:'取引先A社への提案資料を確認',project:'営業改善',assignee:'田中',due:'2026-09-22',priority:'high',status:'todo'},
      {id:2,title:'新商品ページの原稿レビュー',project:'新商品ローンチ',assignee:'佐藤',due:'2026-09-24',priority:'mid',status:'todo'},
      {id:3,title:'9月度の営業実績を集計',project:'営業改善',assignee:'鈴木',due:'2026-09-23',priority:'mid',status:'doing'},
      {id:4,title:'キックオフ会議の日程調整',project:'新商品ローンチ',assignee:'田中',due:'2026-09-25',priority:'low',status:'doing'},
      {id:5,title:'経費精算フローの最終確認',project:'社内運用',assignee:'佐藤',due:'2026-09-22',priority:'high',status:'review'},
      {id:6,title:'週次レポートを共有',project:'営業改善',assignee:'田中',due:'2026-09-19',priority:'low',status:'done'}
    ];
    let tasks=JSON.parse(localStorage.getItem('flowdesk-tasks')||'null')||initial; let currentUser=localStorage.getItem('flowdesk-user')||''; const cols=[['todo','未着手'],['doing','未着手'],['review','確認待ち'],['done','完了']]; cols[1][1]='進行中';
    const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function save(){localStorage.setItem('flowdesk-tasks',JSON.stringify(tasks))};
    function render(){const q=search.value.toLowerCase(),a=assignee.value,p=project.value; const filtered=tasks.filter(t=>(!q||t.title.toLowerCase().includes(q))&&(!a||t.assignee===a)&&(!p||t.project===p)); board.innerHTML=cols.map(([key,label])=>{const list=filtered.filter(t=>t.status===key);return `<div class="column"><div class="column-head">${label}<span class="count">${list.length}</span></div>${list.map(t=>`<article class="card" onclick="advance(${t.id})"><span class="tag ${t.priority==='high'?'priority-high':t.priority==='mid'?'priority-mid':''}">${t.priority==='high'?'優先度：高':t.priority==='mid'?'優先度：中':'優先度：低'}</span><h3>${esc(t.title)}</h3><div class="meta"><span>${esc(t.project)} · ${t.due.slice(5).replace('-','/')}</span><span class="person">${esc(t.assignee[0])}</span></div></article>`).join('')||'<div class="empty">タスクはありません</div>'}</div>`}).join('');
      openCount.textContent=tasks.filter(t=>t.status!=='done'&&t.assignee===currentUser).length; todayCount.textContent=tasks.filter(t=>t.status!=='done'&&t.due==='2026-09-22').length; doneCount.textContent=tasks.filter(t=>t.status==='done').length; }
    function advance(id){const t=tasks.find(x=>x.id===id),i=cols.findIndex(c=>c[0]===t.status);if(i<3){t.status=cols[i+1][0];save();render();}}
    function openDialog(){due.value='2026-09-29';taskDialog.showModal()}
    function addTask(e){e.preventDefault();tasks.unshift({id:Date.now(),title:title.value,project:newProject.value,assignee:newAssignee.value,due:due.value,priority:priority.value,status:'todo'});save();taskDialog.close();e.target.reset();render();renderCalendar()}
    let calendarMonth=new Date(2026,8,1); const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    function renderCalendar(){const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),todayKey='2026-09-22';monthLabel.textContent=`${y}年${m+1}月`;calendarGrid.innerHTML=['日','月','火','水','木','金','土'].map(d=>`<div class="weekday">${d}</div>`).join('')+Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const key=ymd(d),list=tasks.filter(t=>t.due===key);return `<div class="day ${d.getMonth()!==m?'muted':''} ${key===todayKey?'today':''}"><span class="date">${d.getDate()}</span>${list.map(t=>`<button class="calendar-task ${t.priority==='high'?'high':''} ${t.status==='done'?'done':''}" onclick="advance(${t.id});renderCalendar()">${esc(t.title)}</button>`).join('')}</div>`}).join('')}
    function showCalendar(){dashboardView.hidden=true;calendarView.hidden=false;pageTitle.textContent='カレンダー';today.textContent='期限ごとのタスクを確認できます';dashboardNav.classList.remove('active');calendarNav.classList.add('active');renderCalendar()}
    function showDashboard(){dashboardView.hidden=false;calendarView.hidden=true;pageTitle.textContent='ダッシュボード';today.textContent='2026年9月22日（火） · チームの業務状況をひと目で確認できます';calendarNav.classList.remove('active');dashboardNav.classList.add('active')}
    function changeMonth(amount){calendarMonth.setMonth(calendarMonth.getMonth()+amount);renderCalendar()} function goToday(){calendarMonth=new Date(2026,8,1);renderCalendar()}
    function updateUser(){document.querySelector('.user').innerHTML=`<span class="avatar">${currentUser[0]}</span>${currentUser}<br><small style="margin-left:40px;color:#91a1ba">デモアカウント</small>`}
    function signIn(e){e.preventDefault();currentUser=loginMember.value;localStorage.setItem('flowdesk-user',currentUser);updateUser();loginDialog.close();render()}
    let installEvent; window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;installBtn.hidden=false}); installBtn.onclick=async()=>{if(installEvent){installEvent.prompt();await installEvent.userChoice;installBtn.hidden=true}};
    if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');
    today.textContent='2026年9月22日（火） · チームの業務状況をひと目で確認できます'; if(!currentUser) loginDialog.showModal(); else updateUser();render();
  </script>
</body></html>
